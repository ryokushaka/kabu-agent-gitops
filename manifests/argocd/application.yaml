apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kabu-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/ryokushaka/kabu-agent-gitops.git
    targetRevision: main
    path: manifests/kabu-agent
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kabu-agent

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
