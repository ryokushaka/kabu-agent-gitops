apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-base
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/ryokushaka/kabu-agent-gitops.git
    targetRevision: main
    path: manifests/monitoring
    directory:
      recurse: true
      exclude: '{prometheus-values.yaml,grafana-values.yaml}'

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
